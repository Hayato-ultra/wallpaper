{% extends 'base.html' %}
{% block title %}Contact Us — Wallpaper Haven{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="mb-10">
    <h1 class="text-3xl font-bold text-white">Contact Us</h1>
    <p class="mt-2 text-gray-400 text-sm">Have a question, suggestion, or just want to say hello? Drop us a message.</p>
  </div>

  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label for="id_name" class="block text-sm font-medium text-gray-300 mb-1.5">Name</label>
        <input type="text" name="name" id="id_name" required maxlength="100" class="block w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors" placeholder="Your name">
      </div>
      <div>
        <label for="id_email" class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
        <input type="email" name="email" id="id_email" required class="block w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors" placeholder="you@example.com">
      </div>
    </div>

    <div>
      <label for="id_subject" class="block text-sm font-medium text-gray-300 mb-1.5">Subject</label>
      <input type="text" name="subject" id="id_subject" required maxlength="200" class="block w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors" placeholder="What's this about?">
    </div>

    <div>
      <label for="id_message" class="block text-sm font-medium text-gray-300 mb-1.5">Message</label>
      <textarea name="message" id="id_message" required rows="6" class="block w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-sm text-white placeholder-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors resize-y" placeholder="Your message..."></textarea>
    </div>

    <button type="submit" class="inline-flex items-center justify-center h-12 px-6 rounded-xl bg-blue-600 text-sm font-semibold text-white hover:bg-blue-500 transition-all duration-200 shadow-lg shadow-blue-500/20 gap-2">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      Send Message
    </button>
  </form>
</div>
{% endblock %}
