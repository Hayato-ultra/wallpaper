{% load wallpaper_tags %}
<a href="{% url 'wallpaper_detail' pk=wallpaper.pk %}" class="wp-card group relative overflow-hidden rounded-xl glass-panel transition-all duration-500 hover:bg-surface-bright hover:-translate-y-0.5 block">
  <div class="relative overflow-hidden bg-surface-container-low" style="aspect-ratio:{% if wallpaper.width and wallpaper.height %}{% if wallpaper.width >= wallpaper.height %}{{ wallpaper.width }}/{{ wallpaper.height }}{% else %}3/4{% endif %}{% else %}4/3{% endif %}">
    <img src="{{ wallpaper.thumbnail_url }}" alt="{{ wallpaper.title }}" class="h-full w-full object-cover transition-all duration-700 group-hover:scale-105" loading="lazy">
    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

    <div class="absolute bottom-0 left-0 right-0 p-4 translate-y-6 group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-400">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-xs text-white/70 bg-black/40 backdrop-blur-sm rounded-full px-2.5 py-1">
          <span class="material-symbols-outlined text-[12px]">visibility</span>
          {{ wallpaper.views|format_number }}
        </span>
        <span class="flex items-center gap-1.5 text-xs text-white/70 bg-black/40 backdrop-blur-sm rounded-full px-2.5 py-1">
          <span class="material-symbols-outlined text-[12px]">download</span>
          {{ wallpaper.downloads|format_number }}
        </span>
      </div>
    </div>
  </div>
  <div class="p-3.5">
    <h3 class="text-sm font-medium text-on-surface/90 truncate group-hover:text-on-surface transition-colors">{{ wallpaper.title }}</h3>
    <div class="mt-2 flex flex-wrap gap-1.5">
      {% for tag in wallpaper.tags|slice:":3" %}
      <span class="text-[10px] font-medium text-on-surface-variant/60 bg-white/[0.04] rounded-full px-2.5 py-0.5 border border-white/[0.04]">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</a>
