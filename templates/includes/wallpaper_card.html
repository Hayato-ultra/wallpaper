{% load wallpaper_tags %}
<a href="{% url 'wallpaper_detail' pk=wallpaper.pk %}" class="wp-card group relative overflow-hidden rounded-xl bg-white/[0.03] border border-white/[0.06] transition-all duration-500 hover:border-blue-500/30 hover:shadow-2xl hover:shadow-blue-500/10 hover:-translate-y-0.5 block">
  <div class="aspect-[4/3] relative overflow-hidden bg-white/[0.02]">
    <img src="{{ wallpaper.thumbnail_url }}" alt="{{ wallpaper.title }}" class="h-full w-full object-cover transition-all duration-700 group-hover:scale-110" loading="lazy">
    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
    <div class="absolute inset-0 ring-1 ring-inset ring-white/[0.02] group-hover:ring-blue-500/20 rounded-xl transition-all duration-500"></div>

    <div class="absolute bottom-0 left-0 right-0 p-4 translate-y-6 group-hover:translate-y-0 opacity-0 group-hover:opacity-100 transition-all duration-400">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 text-xs text-white/70 bg-black/40 backdrop-blur-sm rounded-full px-2.5 py-1">
          <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          {{ wallpaper.views|format_number }}
        </span>
        <span class="flex items-center gap-1.5 text-xs text-white/70 bg-black/40 backdrop-blur-sm rounded-full px-2.5 py-1">
          <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          {{ wallpaper.downloads|format_number }}
        </span>
      </div>
    </div>
  </div>
  <div class="p-3.5">
    <h3 class="text-sm font-medium text-white/90 truncate group-hover:text-white transition-colors">{{ wallpaper.title }}</h3>
    <div class="mt-2 flex flex-wrap gap-1.5">
      {% for tag in wallpaper.tags|slice:":3" %}
      <span class="text-[10px] font-medium text-gray-500 bg-white/[0.04] rounded-full px-2.5 py-0.5 border border-white/[0.04]">{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
</a>
