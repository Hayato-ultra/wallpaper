<div id="wallpaper-grid" class="columns-2 gap-3 sm:columns-3 lg:columns-4 [column-fill:_balance]">
  {% for wp in page_obj %}
    <div class="break-inside-avoid mb-3 sm:mb-4">
      {% include 'includes/wallpaper_card.html' with wallpaper=wp masonry=True %}
    </div>
  {% endfor %}
</div>
<div id="scroll-sentinel" data-page="{{ page_obj.number }}"{% if page_obj.has_next %} data-next="{{ page_obj.next_page_number }}"{% endif %}></div>
