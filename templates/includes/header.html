<header class="sticky top-0 z-50 border-b border-white/5 bg-[#0a0a0a]/90 backdrop-blur-2xl">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a href="/" class="flex items-center gap-2.5 group">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 shadow-lg shadow-blue-500/20 transition-transform duration-300 group-hover:scale-105">
        <span class="text-base font-bold text-white">W</span>
      </div>
      <span class="text-lg font-bold text-white tracking-tight hidden sm:block">
        Wallpaper<span class="text-blue-400">Haven</span>
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-1">
      <a href="/" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors rounded-lg hover:bg-white/5">Home</a>
      <a href="/explore/" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors rounded-lg hover:bg-white/5">Explore</a>
      <a href="/explore/?sort=trending" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors rounded-lg hover:bg-white/5">Trending</a>
      {% if user.is_staff %}
      <div class="w-px h-5 bg-white/10 mx-2"></div>
      <a href="/admin/dashboard/" class="px-4 py-2 text-sm text-blue-400 hover:text-blue-300 transition-colors rounded-lg hover:bg-blue-500/10">Admin</a>
      {% endif %}
    </nav>

    <div class="flex items-center gap-2">
      <!-- Inline Search -->
      <div id="search-root" class="relative flex items-center">
        <div id="search-bar" class="flex items-center overflow-hidden transition-all duration-300 ease-in-out" style="max-width: 0; opacity: 0; visibility: hidden;">
          <form id="search-form" action="/search/" method="get" class="flex items-center gap-1">
            <input id="search-input" name="q" type="text" placeholder="Search wallpapers..." autocomplete="off" class="w-52 h-9 bg-white/5 border border-white/10 rounded-lg px-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50">
            <button type="submit" class="rounded-lg p-1.5 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </button>
          </form>
        </div>
        <button id="search-btn" class="rounded-xl p-2.5 text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-200" aria-label="Search">
          <svg id="search-icon-open" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <svg id="search-icon-close" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
        <!-- Suggestions -->
        <div id="search-suggestions" class="hidden absolute top-full right-0 mt-2 w-64 p-4 rounded-xl bg-[#0a0a0a] border border-white/5 shadow-xl z-50">
          <p class="text-xs text-gray-500 mb-3 font-semibold uppercase tracking-wider">Suggestions</p>
          <div class="space-y-1">
            <button class="suggestion-chip w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-left" data-q="cars">
              <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18h12"/></svg>
              Cars
            </button>
            <button class="suggestion-chip w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-left" data-q="anime">
              <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
              Anime
            </button>
            <button class="suggestion-chip w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-left" data-q="nature">
              <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
              Nature
            </button>
            <button class="suggestion-chip w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition-colors text-left" data-q="dark">
              <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
              Dark
            </button>
          </div>
        </div>
      </div>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button type="submit" class="hidden sm:inline-flex text-sm text-gray-500 hover:text-gray-300 transition-colors px-3 py-2 rounded-lg hover:bg-white/5">Logout</button>
      </form>
      {% endif %}
      <button id="mobile-menu-toggle" class="md:hidden rounded-xl p-2.5 text-gray-400 hover:text-white hover:bg-white/5 transition-all duration-200" aria-label="Toggle menu">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="hidden border-t border-white/5 bg-[#0a0a0a] md:hidden">
    <div class="px-3 pt-3 pb-2">
      <form action="/search/" method="get" class="relative">
        <input name="q" type="text" placeholder="Search wallpapers..." class="w-full h-10 bg-white/5 border border-white/10 rounded-xl px-4 pr-10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50">
        <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-gray-400 hover:text-white transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
      </form>
      <div class="flex flex-wrap gap-2 mt-3">
        <a href="/search/?q=cars" class="text-xs px-3 py-1.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-colors">Cars</a>
        <a href="/search/?q=anime" class="text-xs px-3 py-1.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-colors">Anime</a>
        <a href="/search/?q=nature" class="text-xs px-3 py-1.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-colors">Nature</a>
        <a href="/search/?q=dark" class="text-xs px-3 py-1.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-colors">Dark</a>
      </div>
    </div>
    <nav class="space-y-0.5 px-3 py-3">
      <a href="/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-gray-300 hover:text-white hover:bg-white/5 transition-colors">
        <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="/explore/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-gray-300 hover:text-white hover:bg-white/5 transition-colors">
        <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Explore
      </a>
      <a href="/explore/?sort=trending" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-gray-300 hover:text-white hover:bg-white/5 transition-colors">
        <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
        Trending
      </a>
      {% if user.is_staff %}
      <hr class="border-white/5 my-2">
      <a href="/admin/dashboard/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-blue-400 hover:text-blue-300 hover:bg-blue-500/10 transition-colors">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Dashboard
      </a>
      <a href="/upload/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-blue-400 hover:text-blue-300 hover:bg-blue-500/10 transition-colors">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        Upload
      </a>
      {% endif %}
    </nav>
  </div>
</header>
