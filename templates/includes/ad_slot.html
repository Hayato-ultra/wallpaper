{% load wallpaper_tags %}
{% if ads_enabled %}
{% adsense_client_id as ad_client %}
{% if ad_client %}
<div class="flex items-center justify-center overflow-hidden my-6 rounded-xl glass-panel" style="min-height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px;">
  <ins class="adsbygoogle"
       style="display:block;width:{% if format == 'leaderboard' %}728{% elif format == 'skyscraper' %}160{% else %}300{% endif %}px;height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px"
       data-ad-client="{{ ad_client }}"
       data-ad-slot="{{ slot_id|default:'1234567890' }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% else %}
<div class="flex items-center justify-center my-6 rounded-xl glass-panel text-on-surface-variant/40 text-label-sm uppercase tracking-wider" style="min-height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px;">
  <div class="flex flex-col items-center gap-2">
    <span class="material-symbols-outlined">star</span>
    Ad Space {% if format %}({{ format }}){% endif %}
  </div>
</div>
{% endif %}
{% endif %}
