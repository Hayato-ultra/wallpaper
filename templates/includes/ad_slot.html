{% load wallpaper_tags %}
{% if ads_enabled %}
{% adsense_client_id as ad_client %}
{% if ad_client %}
<div class="flex items-center justify-center overflow-hidden my-6 rounded-2xl bg-gradient-to-r from-white/[0.02] to-white/[0.01] border border-white/[0.04]" style="min-height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px;">
  <ins class="adsbygoogle"
       style="display:block;width:{% if format == 'leaderboard' %}728{% elif format == 'skyscraper' %}160{% else %}300{% endif %}px;height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px"
       data-ad-client="{{ ad_client }}"
       data-ad-slot="{{ slot_id|default:'1234567890' }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{% else %}
<div class="flex items-center justify-center my-6 rounded-2xl bg-gradient-to-r from-white/[0.01] to-white/[0.02] border border-dashed border-white/[0.06] text-gray-700 text-xs font-medium tracking-wider uppercase" style="min-height:{% if format == 'leaderboard' %}90{% elif format == 'skyscraper' %}600{% else %}250{% endif %}px;">
  <div class="flex flex-col items-center gap-2">
    <svg class="h-5 w-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
    Ad Space {% if format %}({{ format }}){% endif %}
  </div>
</div>
{% endif %}
{% endif %}
