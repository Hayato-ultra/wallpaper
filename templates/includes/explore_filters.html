<!-- Sort By -->
<div>
  <h3 class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-3">Sort By</h3>
  <div class="space-y-1">
    <a href="?sort=newest{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_device %}&device={{ current_device }}{% endif %}" class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_sort == 'newest' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Newest
    </a>
    <a href="?sort=popular{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_device %}&device={{ current_device }}{% endif %}" class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_sort == 'popular' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      Most Viewed
    </a>
    <a href="?sort=trending{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_device %}&device={{ current_device }}{% endif %}" class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_sort == 'trending' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      Trending
    </a>
    <a href="?sort=featured{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_device %}&device={{ current_device }}{% endif %}" class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_sort == 'featured' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      Featured
    </a>
  </div>

  <h3 class="mt-6 text-xs font-semibold uppercase tracking-widest text-gray-500 mb-3">Device</h3>
  <div class="space-y-1">
    <a href="?{% if current_tags %}tags={{ current_tags }}&{% endif %}{% if current_sort != 'newest' %}sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if not current_device %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      All Sizes
    </a>
    <a href="?device=mobile{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_device == 'mobile' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
      Mobile
    </a>
    <a href="?device=tablet{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_device == 'tablet' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      Tablet
    </a>
    <a href="?device=desktop{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_device == 'desktop' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      Desktop
    </a>
    <a href="?device=ultrawide{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_device == 'ultrawide' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      Ultra-wide
    </a>
    <a href="?device=4k{% if current_tags %}&tags={{ current_tags }}{% endif %}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 text-sm transition-all duration-200 {% if current_device == '4k' %}bg-blue-500/10 text-blue-400 font-medium{% else %}text-gray-400 hover:text-white hover:bg-white/5{% endif %}">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
      4K
    </a>
  </div>
</div>

<!-- Tags -->
{% if tags_list %}
<div>
  <h3 class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-3">Tags</h3>
  <div class="flex flex-wrap gap-2">
    {% if current_tags %}
    <a href="/explore/" class="inline-flex items-center gap-1 rounded-full bg-white/5 px-3 py-1.5 text-xs text-gray-400 hover:text-white hover:bg-white/10 transition-colors">
      <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      Clear
    </a>
    {% endif %}
    {% for t in tags_list %}
    <a href="?tags={{ t.tag }}{% if current_sort != 'newest' %}&sort={{ current_sort }}{% endif %}" class="filter-chip inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium transition-all duration-200 {% if current_tags == t.tag %}bg-blue-600 text-white shadow-sm shadow-blue-600/20{% else %}bg-white/5 text-gray-400 hover:text-white hover:bg-white/10{% endif %}">
      {{ t.tag }}
      <span class="ml-1 opacity-50">({{ t.count }})</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endif %}
